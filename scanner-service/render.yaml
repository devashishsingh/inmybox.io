# Render Blueprint — Inmybox Scanner Service
# Deploy: connect repo on Render → "New" → "Blueprint" → select this file.
#
# After deploying:
#   1. Copy the generated SCANNER_TOKEN value.
#   2. Set SCANNER_URL=https://<your-service>.onrender.com in Vercel env vars.
#   3. Set SCANNER_TOKEN=<copied value> in Vercel env vars.
#
# The Next.js API route (/api/scan) will proxy through this service automatically
# when SCANNER_URL is set; it falls back to inline DNS if the service is unreachable.
services:
  - type: web
    name: inmybox-scanner
    runtime: docker
    plan: starter           # free tier — no card required; upgrade to standard later for no cold starts
    region: oregon          # pick the region closest to your Vercel deployment
    rootDir: scanner-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    numInstances: 1         # bump to 2+ for zero-downtime deploys
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SCANNER_TOKEN
        generateValue: true  # Render auto-generates a secret; copy to Vercel as SCANNER_TOKEN
      - key: CACHE_TTL_MS
        value: 300000        # 5 min in-process LRU cache
      - key: CACHE_MAX
        value: 1000          # starter has 512 MB RAM; keep cache smaller
      - key: RATE_LIMIT_MAX
        value: 60
      - key: RATE_LIMIT_WINDOW
        value: 1 minute
      - key: CORS_ORIGIN
        value: https://inmybox.io,https://www.inmybox.io,https://inmybox-io.vercel.app
      - key: LOG_LEVEL
        value: info
